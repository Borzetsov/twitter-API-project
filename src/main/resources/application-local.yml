spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start_only

  application:
    name: twitter-API-project

  datasource:
    url: jdbc:postgresql://${spring.docker.compose.service.postgres-db.host}:${spring.docker.compose.service.postgres-db.ports[5432]}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 1h
